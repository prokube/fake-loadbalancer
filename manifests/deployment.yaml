---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-lb-operator
  namespace: nginx-lb-operator
  labels:
    app.kubernetes.io/name: nginx-lb-operator
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  strategy:
    type: Recreate  # Only one operator instance should run at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-lb-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-lb-operator
        app.kubernetes.io/component: operator
    spec:
      imagePullSecrets:
        - name: regcred-prokube-dev
      serviceAccountName: nginx-lb-operator
      containers:
        - name: operator
          image: europe-west3-docker.pkg.dev/prokube-internal/prokube-dev/nginx-load-balancer:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
