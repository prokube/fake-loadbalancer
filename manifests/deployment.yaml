---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bare-service-lb
  namespace: bare-service-lb
  labels:
    app.kubernetes.io/name: bare-service-lb
    app.kubernetes.io/component: operator
spec:
  replicas: 2
  strategy:
    type: RollingUpdate  # Multiple replicas supported with leader election
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: bare-service-lb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bare-service-lb
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: bare-service-lb
      containers:
        - name: operator
          image: ghcr.io/prokube/bare-service-lb:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LEADER_ELECTION_LEASE_NAME
              value: "bare-service-lb-leader"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
