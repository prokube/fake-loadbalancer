# Example: LoadBalancer Service with Proxy Protocol
#
# This example deploys an nginx backend configured to accept Proxy Protocol,
# so you can verify that bare-service-lb correctly forwards the real client IP.
#
# Apply:
#   kubectl apply -f examples/sample-service-proxy-protocol.yaml
#   kubectl get svc sample-web-pp
#
# Test:
#   curl http://<EXTERNAL-IP>
#
# Check the backend pod logs — you should see the real client IP instead of
# the node IP:
#   kubectl logs -l app=sample-web-pp
#
# To clean up:
#   kubectl delete -f examples/sample-service-proxy-protocol.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-web-pp-nginx-config
data:
  default.conf: |
    server {
        listen 80 proxy_protocol;

        # Trust the PROXY header from any source (the bare-service-lb
        # DaemonSet runs on the same node, so the source is always local).
        set_real_ip_from 0.0.0.0/0;
        real_ip_header proxy_protocol;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-web-pp
  labels:
    app: sample-web-pp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-web-pp
  template:
    metadata:
      labels:
        app: sample-web-pp
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: sample-web-pp-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: sample-web-pp
  annotations:
    bare-service-lb.prokube.ai/proxy-protocol: "true"
spec:
  type: LoadBalancer
  selector:
    app: sample-web-pp
  ports:
    - name: http
      port: 8080
      targetPort: 80
