# externalTrafficPolicy: Local keeps the client IP, but a node without a pod drops the traffic.
# A DaemonSet puts a pod on every node, so every advertised node IP can answer.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: whoami-local
spec:
  selector:
    matchLabels: {app: whoami-local}
  template:
    metadata:
      labels: {app: whoami-local}
    spec:
      tolerations:  # kubeadm taints control-plane nodes, but their IPs are advertised too
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      containers:
      - name: whoami
        image: traefik/whoami:v1.10
        args: ["--port", "8080"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-local
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: {app: whoami-local}
  ports:
  - name: http
    port: 8081
    targetPort: 8080
