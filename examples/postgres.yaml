# Not just HTTP: Postgres on its real port 5432 on every node IP, not a 30000+ NodePort.
# Demo only: throwaway password, no persistence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        env:
        - {name: POSTGRES_PASSWORD, value: demo}
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: LoadBalancer
  selector: {app: postgres}
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
