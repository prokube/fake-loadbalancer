name: Build Dev Version of bare-service-lb Image
on:
  workflow_dispatch:
  push:
    branches-ignore:
    - 'main'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE_NAME: "bare-service-lb"
  REGISTRY: "ghcr.io"
jobs:
  bare-service-lb-dev-image:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
  
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
  
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
  
    - name: Create Docker tag from branch name
      id: create_docker_tag
      run: |
        # Create docker tag from branch name by replacing any characters that are not allowed in Docker tags
        DOCKER_TAG=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/--*/-/g')
        # Docker tags cannot start with a period or dash; strip any leading '.' or '-'
        DOCKER_TAG=$(echo "$DOCKER_TAG" | sed 's/^[.-]\+//')
        # Enforce Docker tag maximum length of 128 characters
        DOCKER_TAG=${DOCKER_TAG:0:128}
        # Ensure the tag is not empty
        if [ -z "$DOCKER_TAG" ]; then
          echo "❌ ERROR: Generated Docker tag is empty. Please ensure the branch name contains valid characters."
          exit 1
        fi
        echo "docker_tag=$DOCKER_TAG" >> $GITHUB_OUTPUT
  
    - name: Build and push bare-service-lb dev image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.create_docker_tag.outputs.docker_tag }}
          ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:commit-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
