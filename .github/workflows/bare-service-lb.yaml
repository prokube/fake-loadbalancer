name: Build bare-service-lb Image
on:
  push:
    tags:
    - 'v*' # Only version tags (v1.0.0, v2.1.3, etc.)
env:
  IMAGE_NAME: "bare-service-lb"
  REGISTRY: "ghcr.io"
jobs:
  bare-service-lb-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Extract version tag
      id: version
      run: echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
    
    - name: Build and push bare-service-lb image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:commit-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
