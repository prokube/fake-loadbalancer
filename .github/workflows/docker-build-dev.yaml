name: Docker build and push dev to ghcr.io

on:
  workflow_dispatch:
  push:
    branches-ignore: ["main"]
    paths:
      - "lb_operator/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Docker tags
        id: tags
        run: |
          SAFE_REF_NAME=$(echo '${{ github.ref_name }}' | sed 's/[^a-zA-Z0-9._-]/-/g' | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/prokube/dev/bare-service-lb"
          echo "tags=${IMAGE_NAME}:dev-${SAFE_REF_NAME},${IMAGE_NAME}:dev-commit-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
