name: Docker build and push version tag to ghcr.io

on:
  push:
    tags: [ "v*" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "Tag is not on main branch"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Docker tags
        id: tags
        run: |
          set -euo pipefail

          IMAGE_NAME="ghcr.io/prokube/bare-service-lb"
          VERSION_TAG="${{ github.ref_name }}"
          VERSION_TAG="${VERSION_TAG#v}" # Remove the leading 'v'

          TAGS="${IMAGE_NAME}:${VERSION_TAG},${IMAGE_NAME}:commit-${{ github.sha }}"

          # Determine if this version is the latest semantic version
          git fetch --tags origin
          LATEST_VERSION="$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n 1 || true)"
          if [ -z "${LATEST_VERSION}" ]; then
            LATEST_VERSION="${VERSION_TAG}"
          fi

          IS_LATEST=false
          if [ "${VERSION_TAG}" = "${LATEST_VERSION}" ]; then
            IS_LATEST=true
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          fi

          echo "Current version: ${VERSION_TAG}, highest tagged version: ${LATEST_VERSION}, will update 'latest': ${IS_LATEST}"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
