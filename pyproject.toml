[project]
name = "bare-service-lb"
version = "0.1.0"
description = "ServiceLB for bare-metal, cloud VMs, and anywhere without a cloud LoadBalancer. Inspired by k3s ServiceLB."
requires-python = ">=3.11"
dependencies = [
    "kopf>=1.37,<2",
    "kubernetes>=31,<33",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pyright>=1.1",
    "pylint>=3",
    "isort>=5",
    "black>=24",
]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.isort]
profile = "black"

[tool.black]
line-length = 100
target-version = ["py311"]
