[project]
name = "nginx-lb-operator"
version = "0.1.0"
description = "Kubernetes operator that converts LoadBalancer Services to hostPort-based NGINX TCP proxies"
requires-python = ">=3.11"
dependencies = [
    "kopf>=1.37,<2",
    "kubernetes>=31,<33",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
