---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gcp-external-ip-annotator
  namespace: nginx-lb-operator
  labels:
    app.kubernetes.io/name: gcp-external-ip-annotator
    app.kubernetes.io/component: node-annotator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gcp-external-ip-annotator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gcp-external-ip-annotator
        app.kubernetes.io/component: node-annotator
    spec:
      serviceAccountName: gcp-external-ip-annotator
      terminationGracePeriodSeconds: 5
      containers:
        - name: annotator
          image: alpine/k8s:1.32.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              ANNOTATION="nginx-lb-operator.prokube.ai/external-ip"
              METADATA_URL="http://metadata.google.internal/computeMetadata/v1/instance/network-interfaces/0/access-configs/0/external-ip"
              INTERVAL="${SYNC_INTERVAL:-300}"

              echo "Starting GCP external IP annotator for node ${NODE_NAME}"
              echo "Sync interval: ${INTERVAL}s"

              while true; do
                IP=$(wget -qO- --header="Metadata-Flavor: Google" "${METADATA_URL}" 2>/dev/null) || true
                if [ -n "${IP}" ]; then
                  kubectl annotate node "${NODE_NAME}" "${ANNOTATION}=${IP}" --overwrite
                  echo "Annotated node ${NODE_NAME} with ${ANNOTATION}=${IP}"
                else
                  echo "Warning: could not retrieve external IP from GCP metadata server"
                fi
                sleep "${INTERVAL}"
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SYNC_INTERVAL
              value: "300"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
