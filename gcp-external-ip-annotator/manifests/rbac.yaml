---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gcp-external-ip-annotator
  namespace: bare-service-lb
  labels:
    app.kubernetes.io/name: gcp-external-ip-annotator
    app.kubernetes.io/component: node-annotator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gcp-external-ip-annotator
  labels:
    app.kubernetes.io/name: gcp-external-ip-annotator
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gcp-external-ip-annotator
  labels:
    app.kubernetes.io/name: gcp-external-ip-annotator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gcp-external-ip-annotator
subjects:
  - kind: ServiceAccount
    name: gcp-external-ip-annotator
    namespace: bare-service-lb
